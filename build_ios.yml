name: Build iOS (unsigned IPA)

# 手动触发，或推送到 master 时触发
on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 设置 Flutter（与官方 CI 一致的版本）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 还原依赖
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 编译 iOS（不签名，无需任何证书/开发者账号）
      - name: Build iOS
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      # 打包为未签名 IPA
      - name: Create IPA
        run: |
          cd simple_live_app/build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -q -r ios_no_sign.ipa Payload

      # 上传构建产物（在 Actions 运行页面下载）
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios_no_sign_ipa
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa
